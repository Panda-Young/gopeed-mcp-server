[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopeed-mcp-server"
version = "0.1.0"
description = "MCP server to control the Gopeed download manager from VS Code Copilot Chat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Panda-Young" }]
keywords = ["mcp", "gopeed", "download", "copilot", "vscode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Panda-Young/gopeed-mcp-server"
Repository = "https://github.com/Panda-Young/gopeed-mcp-server"
Issues = "https://github.com/Panda-Young/gopeed-mcp-server/issues"

[project.scripts]
gopeed-mcp-server = "server:main"

[tool.setuptools]
py-modules = ["server", "gopeed_client", "config"]
