[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopeed-mcp-server"
version = "0.3.0"
description = "MCP server to control the Gopeed download manager from any MCP-compatible AI Agent (VS Code Copilot Chat, WorkBuddy, Trae, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panda-Young" }]
keywords = ["mcp", "gopeed", "download", "ai-agent", "copilot", "workbuddy", "trae", "vscode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Panda-Young/gopeed-mcp-server"
Repository = "https://github.com/Panda-Young/gopeed-mcp-server"
Issues = "https://github.com/Panda-Young/gopeed-mcp-server/issues"

[project.scripts]
gopeed-mcp-server = "gopeed_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gopeed_mcp_server*"]

[tool.setuptools]
license-files = ["LICENSE"]
